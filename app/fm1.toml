# AQ-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "AQ1"                   # the build's files: aq1.fwsc, aq1-X.Y.fwsc
id_prefix = "FM-1_9"           # package identity: dev FM-1_900, releases FM-1_9XXYYZZ
usb_manufacturer = "AQ-1"
usb_product = "AQ-1 FM-1"
ble = false                    # AQ-1 never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/amb.c", "dsp/brk.c"]             # the engine, at -O2
# the site
tagline = "A quiet console with no disc in it"
repo = ""
licence = "MPL-2.0"
credits = "Forked from AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
